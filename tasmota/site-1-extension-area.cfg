Backlog PowerOnState 1; Power1 1
Backlog Rule1 0; Rule2 0; Rule3 0; Rule1 ""; Rule2 ""; Rule3 ""
Rule1 ON System#Boot DO Backlog PowerOnState 1; Power1 1; Var1 0; Var4 0; RuleTimer1 120 ENDON ON Power1#State=1 DO Backlog Var1 0; RuleTimer2 0; RuleTimer1 120 ENDON ON Power1#State=0 DO Backlog RuleTimer1 0; RuleTimer4 0; RuleTimer5 0; RuleTimer2 60 ENDON ON Rules#Timer=2 DO Power1 1 ENDON
Rule2 ON Rules#Timer=1 DO Backlog Var4 0; Ping4 192.168.1.1; RuleTimer4 5; RuleTimer1 60 ENDON ON Rules#Timer=4 DO Backlog Ping4 192.168.1.7; RuleTimer5 10 ENDON ON Rules#Timer=5 DO Event PingEval=%var4% ENDON ON Ping#192.168.1.1#Success>0 DO Add4 1 ENDON ON Ping#192.168.1.7#Success>0 DO Add4 1 ENDON
Rule3 ON Event#PingEval==0 DO Add1 1 ENDON ON Event#PingEval>0 DO Var1 0 ENDON ON Var1#State>=5 DO Backlog Var1 0; RuleTimer1 0; Power1 0; RuleTimer3 15 ENDON ON Rules#Timer=3 DO Power1 1 ENDON ON Event#PowerCycle DO Backlog Var1 0; RuleTimer1 0; Power1 0; RuleTimer3 15 ENDON
Backlog Rule1 1; Rule2 1; Rule3 1
Backlog Var1 0; Var4 0; RuleTimer1 120
SaveData 1
SetOption65 1
Restart 1